enchantability = 15

# 年轻狮子大剑 / Young lion greatsword
[equipment.weapons.young_lion_greatsword]
# 攻击伤害 / Attack damage
attack_damage = 12.0
# 攻击速度 / Attack speed
attack_speed = 1.0
