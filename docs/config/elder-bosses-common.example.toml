# 20tick = 1秒 / second. 距离 / distance: 格 / blocks.
# 装备和基础属性需重启；战斗设置在下一场生效。
# Restart for equipment and base attributes; combat settings apply to the next encounter.

# 奉献义手刀 / Consecrated prosthetic blade
