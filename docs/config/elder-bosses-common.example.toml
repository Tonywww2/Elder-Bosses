enchantability = 15

# 金针 / Golden needle
[equipment.curios.golden_needle]
# 腐败容量加成 / Rot capacity bonus — 玩家基础腐败容量为100；此值直接增加容量，0关闭加成。 / Adds to the player's base scarlet rot capacity of 100; 0 disables the bonus.
rot_capacity_bonus = 40.0

# 奉献义手刀 / Consecrated prosthetic blade
[equipment.curios.consecrated_prosthetic_blade]
