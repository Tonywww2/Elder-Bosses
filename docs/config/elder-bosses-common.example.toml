# Boss音乐 / Boss music
[boss_music]
# 启用 / Enabled
enabled = true
# 音量 / Volume
volume = 0.85
# 距离 · 格 / Distance · blocks
distance = 96.0
# 淡出时间 · tick / Fade ticks · ticks
fade_ticks = 40

# 地面技能范围指示器 / Ground skill indicators
[indicators]
