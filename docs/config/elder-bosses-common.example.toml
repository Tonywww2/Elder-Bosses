# 该档距离上限 · 格 / Max distance · blocks — 此距离档的上限，单位为格；最后一档填-1表示覆盖剩余距离，其他档位从小到大排列。 / Distance ceiling in blocks; use -1 in the final band for the remaining distance and order other bands from near to far.
