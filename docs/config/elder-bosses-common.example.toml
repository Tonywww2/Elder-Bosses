# 架势与失衡 / Stagger
[malenia.stagger]
# 伤害转为架势累积的比例 / Damage conversion ratio — 有效伤害转为架势累积的倍率；不改变Boss实际承受的生命伤害。 / Multiplier converting effective damage into stagger buildup; does not alter health damage taken by the boss.
damage_conversion_ratio = 1.0
# 架势容量占生命上限的比例 / Capacity health ratio — 架势上限相对于Boss生命上限的比例。 / Stagger capacity as a fraction of the boss's maximum health.
capacity_health_ratio = 0.5
# 快速失衡保护统计窗口 · tick / Rapid window ticks · ticks — 统计近期架势增长的时间窗口，用于快速失衡保护。 / Window for tracking recent stagger growth for rapid stagger protection.
rapid_window_ticks = 240
# 快速失衡保护分档比例 / Rapid fraction — 快速增长触发的分档比例；0.25表示按25%容量档位保护。 / Capacity fraction for rapid growth protection tiers; 0.25 means 25% capacity tiers.
rapid_fraction = 0.25
# 相同伤害来源去重窗口 · tick / dedupe ticks · ticks
source_dedupe_ticks = 5
# 架势衰减前的等待时间 · tick / Decay delay ticks · ticks
